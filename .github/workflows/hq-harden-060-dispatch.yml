name: HQ one-shot 0.6.0 dispatch persistence hardening

on:
  push:
    branches:
      - release/0.6.0-control-center
    paths:
      - .github/workflows/hq-harden-060-dispatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.6.0-control-center
          fetch-depth: 0

      - name: Apply exact dispatch persistence hardening
        run: python3 .github/hq_harden_060_dispatch.py

      - name: Verify, clean helper and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/hq_harden_060_dispatch.py .github/workflows/hq-harden-060-dispatch.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: persist at-most-once checkpoint before notifications"
          git push origin HEAD:release/0.6.0-control-center
