name: ChatPulse 0.7.0 beta release gate
# workflow_dispatch is retained so a frozen RC can be revalidated without modifying product code.

on:
  workflow_dispatch:
  push:
    branches:
      - release/0.7.0-github-actions-watchdog
      - release/0.7.0-browser-e2e-hardening
      - main
    paths:
      - ".github/workflows/extension-ci.yml"
      - "chrome-extension/**"
      - "tests/chrome-extension/**"
      - "tests/browser/**"
      - "scripts/**"
      - "package.json"
      - "README.md"
      - "CHANGELOG.md"
      - "PRIVACY.md"
      - "SECURITY.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/extension-ci.yml"
      - "chrome-extension/**"
      - "tests/chrome-extension/**"
      - "tests/browser/**"
      - "scripts/**"
      - "package.json"
      - "README.md"
      - "CHANGELOG.md"
      - "PRIVACY.md"
      - "SECURITY.md"

permissions:
  contents: read

concurrency:
  group: chatpulse-0.7.0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Full extension audit — cycle ${{ matrix.round }}
    runs-on: [self-hosted, fast]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact event head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "candidate_sha=$GITHUB_SHA"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax, unit, task, GitHub watchdog, Telegram and static security audit
        run: npm run audit:extension

  browser-e2e:
    name: Chromium MV3 browser E2E — GitHub watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact event head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "candidate_sha=$GITHUB_SHA"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and audit pinned Playwright Chromium harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.62.1
          npm audit --audit-level=high
          npx playwright install --with-deps chromium

      - name: Run loaded-extension GitHub watchdog browser E2E
        env:
          CHATPULSE_E2E_REPOSITORY: MishkaStrategy/ChatPulse
        run: node tests/browser/github-watchdog.chrome-e2e.mjs

  package:
    name: Reproducible beta package and provenance
    needs: [audit, browser-e2e]
    runs-on: [self-hosted, fast]
    timeout-minutes: 10

    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact event head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "candidate_sha=$GITHUB_SHA"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build reproducible package twice
        shell: bash
        run: |
          set -euo pipefail
          npm run package:beta
          first_zip="$(awk '{print $1}' dist/ChatPulse-Chrome-v0.7.0-beta.zip.sha256)"
          first_manifest="$(awk '{print $1}' dist/ChatPulse-Chrome-v0.7.0-source-manifest.txt.sha256)"
          npm run package:beta
          second_zip="$(awk '{print $1}' dist/ChatPulse-Chrome-v0.7.0-beta.zip.sha256)"
          second_manifest="$(awk '{print $1}' dist/ChatPulse-Chrome-v0.7.0-source-manifest.txt.sha256)"
          test "$first_zip" = "$second_zip"
          test "$first_manifest" = "$second_manifest"
          echo "artifact_sha256=$second_zip"
          echo "source_manifest_sha256=$second_manifest"

      - name: Verify permissions, version and absence of secrets
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:extension
          ! grep -RIE "API[_-]?KEY|CLIENT[_-]?SECRET|BEGIN (RSA|OPENSSH) PRIVATE KEY" chrome-extension tests scripts
          test ! -d chrome-extension/node_modules
          test ! -f chrome-extension/package-lock.json
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          for name in [
              'ChatPulse-Chrome-v0.7.0-beta.zip',
              'ChatPulse-Chrome-v0.7.0-source-manifest.txt',
          ]:
              path = Path('dist') / name
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              declared = (Path('dist') / f'{name}.sha256').read_text().split()[0]
              if actual != declared:
                  raise SystemExit(f'SHA mismatch for {name}: {actual} != {declared}')
              print(f'{name} sha256={actual}')
          PY

      - name: Upload ChatPulse 0.7.0 beta provenance
        uses: actions/upload-artifact@v4
        with:
          name: ChatPulse-Chrome-v0.7.0-beta
          path: |
            dist/ChatPulse-Chrome-v0.7.0-beta.zip
            dist/ChatPulse-Chrome-v0.7.0-beta.zip.sha256
            dist/ChatPulse-Chrome-v0.7.0-source-manifest.txt
            dist/ChatPulse-Chrome-v0.7.0-source-manifest.txt.sha256
          if-no-files-found: error
          retention-days: 30
