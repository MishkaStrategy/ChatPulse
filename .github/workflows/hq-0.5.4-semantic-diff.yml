name: HQ one-shot 0.5.4 stop-phrase semantic diff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hq-0.5.4-semantic-diff.yml"

permissions:
  contents: read
  issues: read

jobs:
  semantic-diff:
    name: Inspect historical stop-phrase semantics
    runs-on: [self-hosted, fast]
    timeout-minutes: 10
    env:
      OBSERVED_ARCHIVE_SHA: fe85f7384d7b8e1d85106ab4adae0f9d94cfb3a4e3c99a72cbf84c64a3d4753c

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read only stop-phrase-related historical context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import difflib
          import hashlib
          import io
          import json
          import os
          import re
          import tarfile
          import urllib.request
          from pathlib import PurePosixPath

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          expected = os.environ['OBSERVED_ARCHIVE_SHA']
          targets = [
              'chrome-extension/background/service-worker-v2.js',
              'chrome-extension/content/content-script.js',
              'chrome-extension/lib/model-v2.js',
              'README.md',
              'chrome-extension/README.md',
          ]
          pattern = re.compile(r'(stop|phrase|стоп|остан|отключ|disable|enabled)', re.I)

          def api(path):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'chatpulse-hq-semantic-diff',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          issue = api('/issues/14')
          comments = api('/issues/14/comments?per_page=100')
          comments.sort(key=lambda item: item['id'])
          encoded = ''.join(''.join(part.split()) for part in [issue.get('body') or '', *[c.get('body') or '' for c in comments]])
          archive = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(archive).hexdigest()
          if actual != expected:
              raise SystemExit(f'Unexpected diagnostic archive SHA: {actual}')

          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as bundle:
              members = bundle.getmembers()
              if len(members) != 12 or any(not m.isfile() for m in members):
                  raise SystemExit('Unexpected diagnostic archive structure')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe path: {member.name}')
              archived = {}
              for target in targets:
                  try:
                      member = bundle.getmember(target)
                  except KeyError:
                      continue
                  stream = bundle.extractfile(member)
                  archived[target] = (stream.read() if stream else b'').decode('utf-8')

          for target, old_text in archived.items():
              try:
                  with open(target, 'r', encoding='utf-8') as handle:
                      new_text = handle.read()
              except FileNotFoundError:
                  new_text = ''
              old_lines = old_text.splitlines()
              new_lines = new_text.splitlines()
              print(f'=== {target} ===')
              hits = set()
              for idx, line in enumerate(old_lines):
                  if pattern.search(line):
                      hits.update(range(max(0, idx - 4), min(len(old_lines), idx + 5)))
              for idx in sorted(hits):
                  print(f'HIST {idx+1:04d}: {old_lines[idx]}')
              print('--- relevant diff lines ---')
              for line in difflib.unified_diff(new_lines, old_lines, fromfile='current-main', tofile='historical-diagnostic', n=3):
                  if line.startswith(('+++', '---', '@@')) or pattern.search(line):
                      print(line)
              print()
          PY
