name: HQ one-shot final ChatPulse 0.6.0 safety hardening docker pool

on:
  push:
    branches:
      - release/0.6.0-control-center
    paths:
      - .github/workflows/hq-finalize-060-safety-docker.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, docker]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.6.0-control-center
          fetch-depth: 0

      - name: Apply exact final safety hardening
        run: python3 .github/hq_finalize_060_safety.py

      - name: Verify, clean helpers and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm -f .github/hq_finalize_060_safety.py
          rm -f .github/workflows/hq-finalize-060-safety.yml
          rm -f .github/workflows/hq-finalize-060-safety-mac.yml
          rm -f .github/workflows/hq-finalize-060-safety-docker.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: finalize 0.6.0 task and configuration safety"
          git push origin HEAD:release/0.6.0-control-center
