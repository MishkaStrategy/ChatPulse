name: HQ retry 0.7.0 watchdog Control Center

on:
  push:
    branches:
      - release/0.7.0-github-actions-watchdog
    paths:
      - .github/workflows/hq-retry-070-watchdog-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, fast]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.7.0-github-actions-watchdog
          fetch-depth: 0
      - name: Repair deterministic UI helper and apply patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/hq_apply_070_watchdog_ui.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_once(text, old, new, label):\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f'{label}: expected one anchor, found {count}')\n    return text.replace(old, new, 1)\n'''
          new = '''def replace_once(text, old, new, label):\n    count = text.count(old)\n    if label == 'watchdog profile to draft':\n        if count < 1:\n            raise SystemExit(f'{label}: expected at least one anchor, found {count}')\n    elif count != 1:\n        raise SystemExit(f'{label}: expected one anchor, found {count}')\n    return text.replace(old, new, 1)\n'''
          if text.count(old) != 1:
              raise SystemExit('UI helper repair anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/hq_apply_070_watchdog_ui.py
      - name: Verify UI and all regressions
        run: |
          set -euo pipefail
          node --check chrome-extension/options/options.js
          npm test
          git diff --check
      - name: Commit UI and clean helpers
        run: |
          set -euo pipefail
          rm -f scripts/hq_apply_070_watchdog_ui.py .github/workflows/hq-apply-070-watchdog-ui.yml .github/workflows/hq-retry-070-watchdog-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: configure GitHub Actions watchdog per chat"
          git push origin HEAD:release/0.7.0-github-actions-watchdog
