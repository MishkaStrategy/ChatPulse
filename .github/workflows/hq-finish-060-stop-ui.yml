name: HQ one-shot finish ChatPulse 0.6.0 task-stop semantics

on:
  push:
    branches:
      - release/0.6.0-control-center
    paths:
      - .github/workflows/hq-finish-060-stop-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.6.0-control-center
          fetch-depth: 0

      - name: Apply exact final task-stop/UI semantics
        run: python3 .github/hq_finish_060_stop_ui.py

      - name: Verify, clean helper and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/hq_finish_060_stop_ui.py .github/workflows/hq-finish-060-stop-ui.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: finalize task stop and Control Center semantics"
          git push origin HEAD:release/0.6.0-control-center
