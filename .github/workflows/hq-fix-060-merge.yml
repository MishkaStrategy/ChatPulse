name: HQ one-shot 0.6.0 runtime merge repair

on:
  push:
    branches:
      - release/0.6.0-control-center
    paths:
      - .github/workflows/hq-fix-060-merge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.6.0-control-center
          fetch-depth: 0

      - name: Apply exact runtime merge repair
        run: python3 scripts/hq_fix_060_merge.py

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- chrome-extension/lib/model-v2.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chrome-extension/lib/model-v2.js
          git commit -m "fix: preserve manual chat state across runtime merge"
          git push origin HEAD:release/0.6.0-control-center
