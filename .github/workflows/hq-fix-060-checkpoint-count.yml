name: HQ one-shot 0.6.0 dispatch counter merge repair

on:
  push:
    branches:
      - release/0.6.0-control-center
    paths:
      - .github/workflows/hq-fix-060-checkpoint-count.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.6.0-control-center
          fetch-depth: 0

      - name: Apply exact same-run counter repair
        run: python3 .github/hq_fix_060_checkpoint_count.py

      - name: Verify, clean helper and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/hq_fix_060_checkpoint_count.py .github/workflows/hq-fix-060-checkpoint-count.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: count same-run dispatch across profile edits"
          git push origin HEAD:release/0.6.0-control-center
