name: HQ one-shot 0.7.0 GitHub permission gesture hardening

on:
  push:
    branches:
      - release/0.7.0-github-actions-watchdog
    paths:
      - .github/workflows/hq-fix-070-github-permission-gesture.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.7.0-github-actions-watchdog
          fetch-depth: 0
      - name: Keep permission request inside direct user gesture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          options = Path('chrome-extension/options/options.js')
          text = options.read_text(encoding='utf-8')
          old = '''async function ensureGithubPermission() {\n  try {\n    if (await chrome.permissions.contains({ origins: [GITHUB_ORIGIN] })) return true;\n    const granted = await chrome.permissions.request({ origins: [GITHUB_ORIGIN] });'''
          new = '''async function ensureGithubPermission() {\n  try {\n    const granted = await chrome.permissions.request({ origins: [GITHUB_ORIGIN] });'''
          if text.count(old) != 1:
              raise SystemExit('GitHub permission function anchor mismatch')
          options.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/chrome-extension/github-watchdog-ui.test.mjs')
          body = test.read_text(encoding='utf-8')
          old_test = '''  assert.ok(options.includes("chrome.permissions.request({ origins: [GITHUB_ORIGIN] })"));\n  assert.ok(options.includes("if (draft.githubWatchEnabled)"));'''
          new_test = '''  assert.ok(options.includes("chrome.permissions.request({ origins: [GITHUB_ORIGIN] })"));\n  const permissionStart = options.indexOf("async function ensureGithubPermission()");\n  const permissionEnd = options.indexOf("async function exportConfig()", permissionStart);\n  const permissionBlock = options.slice(permissionStart, permissionEnd);\n  assert.equal(permissionBlock.includes("permissions.contains"), false, "permission request must stay in the direct Save/Start user gesture");\n  assert.ok(options.includes("if (draft.githubWatchEnabled)"));'''
          if body.count(old_test) != 1:
              raise SystemExit('GitHub UI permission test anchor mismatch')
          test.write_text(body.replace(old_test, new_test, 1), encoding='utf-8')
          PY
      - name: Verify all regressions
        run: |
          set -euo pipefail
          node --check chrome-extension/options/options.js
          npm test
          git diff --check
      - name: Commit and clean helper
        run: |
          set -euo pipefail
          rm -f .github/workflows/hq-fix-070-github-permission-gesture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: request GitHub permission in direct user gesture"
          git push origin HEAD:release/0.7.0-github-actions-watchdog
