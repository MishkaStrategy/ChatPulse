name: Apply ChatPulse 0.7.3 recovery patch

on:
  push:
    branches:
      - release/0.7.3-replace-stuck-tab
    paths:
      - ".github/workflows/apply-073-recovery-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: release/0.7.3-replace-stuck-tab
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact patch and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_073_recovery_patch.py')
          text = path.read_text(encoding='utf-8')
          old = '"release/0.7.2-private-github-token"'
          new = '"release/0.7.3-private-github-token"'
          if text.count(old) != 1:
              raise SystemExit(f'patch guard hotfix expected one match, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/apply_073_recovery_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate_extension.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "ChatPulse-Chrome-v0.7.2-beta.zip": "ChatPulse-Chrome-v0.7.3-beta.zip",
              "ChatPulse-Chrome-v0.7.2-source-manifest.txt": "ChatPulse-Chrome-v0.7.3-source-manifest.txt",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'validator hotfix expected one match for {old}, got {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          npm run audit:extension

      - name: Commit canonical product patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply_073_recovery_patch.py .github/workflows/apply-073-recovery-patch.yml
          git config user.name "mishkacher"
          git config user.email "73113517+mishkacher@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: replace hung background tabs with fresh tabs"
          git push origin HEAD:release/0.7.3-replace-stuck-tab
