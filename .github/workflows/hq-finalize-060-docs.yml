name: HQ one-shot final ChatPulse 0.6.0 docs alignment

on:
  push:
    branches:
      - release/0.6.0-control-center
    paths:
      - .github/workflows/hq-finalize-060-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.6.0-control-center
          fetch-depth: 0

      - name: Apply exact docs alignment
        run: python3 .github/hq_finalize_060_docs.py

      - name: Verify, clean helper and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm .github/hq_finalize_060_docs.py .github/workflows/hq-finalize-060-docs.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: finalize 0.6.0 task engine safety contract"
          git push origin HEAD:release/0.6.0-control-center
