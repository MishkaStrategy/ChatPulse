name: ChatPulse 0.7.4 bounded auth-grace patch

on:
  push:
    branches:
      - release/0.7.4-independent-actions-watchdog
    paths:
      - ".github/workflows/patch-0.7.4-auth-grace.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, fast]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact auth-grace patch
        run: |
          set -euo pipefail
          python3 scripts/patch_074_auth_grace.py
          git diff --check
      - name: Validate patched candidate
        run: |
          set -euo pipefail
          npm run audit:extension
          npm run package:beta
          test -f dist/ChatPulse-Chrome-v0.7.4-beta.zip
      - name: Commit product, tests and docs
        run: |
          set -euo pipefail
          git config user.name "ChatPulse HQ"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md \
            chrome-extension/background/github-restart-grace.js \
            chrome-extension/background/service-worker-v2.js \
            chrome-extension/lib/model-v2.js \
            package.json \
            scripts/validate_extension.mjs \
            tests/chrome-extension/github-restart-grace.test.mjs \
            tests/chrome-extension/github-watchdog-runtime.test.mjs \
            tests/chrome-extension/github-watchdog-ui.test.mjs \
            tests/chrome-extension/github-watchdog.test.mjs \
            tests/chrome-extension/service-worker.test.mjs
          git diff --cached --check
          git commit -m "fix: add post-open auth grace to GitHub restart"
          git push origin HEAD:release/0.7.4-independent-actions-watchdog
