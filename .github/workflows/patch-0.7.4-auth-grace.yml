name: ChatPulse 0.7.4 bounded auth-grace patch

on:
  push:
    branches:
      - release/0.7.4-independent-actions-watchdog
    paths:
      - ".github/workflows/patch-0.7.4-auth-grace.yml"

permissions:
  contents: write

concurrency:
  group: chatpulse-0.7.4-auth-grace-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact auth-grace patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("CHANGELOG.md")
          text = p.read_text(encoding="utf-8")
          old = "- serialize simultaneous ordinary and GitHub scheduler triggers so a watchdog check is never discarded merely because another ChatPulse check is already running;\n"
          new = "- serialize simultaneous ordinary and GitHub scheduler triggers so a later trigger is queued with its own source/parameters instead of being dropped behind an active check;\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected current 0.7.4 serialization changelog wording")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python3 scripts/patch_074_auth_grace.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/chrome-extension/github-watchdog-runtime.test.mjs")
          text = p.read_text(encoding="utf-8")
          old = "  assert.match(worker, /chatpulse-github-restart-grace:/);\n"
          new = "  assert.match(worker, /chatIdFromGithubRestartGraceAlarm/);\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected auth-grace static assertion")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
      - name: Validate patched candidate
        run: |
          set -euo pipefail
          npm run audit:extension
          npm run package:beta
          test -f dist/ChatPulse-Chrome-v0.7.4-beta.zip
      - name: Commit product, tests and docs
        run: |
          set -euo pipefail
          git config user.name "ChatPulse HQ"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md \
            chrome-extension/background/github-restart-grace.js \
            chrome-extension/background/service-worker-v2.js \
            chrome-extension/lib/model-v2.js \
            package.json \
            scripts/validate_extension.mjs \
            tests/chrome-extension/github-restart-grace.test.mjs \
            tests/chrome-extension/github-watchdog-runtime.test.mjs \
            tests/chrome-extension/github-watchdog-ui.test.mjs \
            tests/chrome-extension/github-watchdog.test.mjs \
            tests/chrome-extension/service-worker.test.mjs
          git diff --cached --check
          git commit -m "fix: add post-open auth grace to GitHub restart"
          git push origin HEAD:release/0.7.4-independent-actions-watchdog
