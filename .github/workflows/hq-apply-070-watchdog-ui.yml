name: HQ one-shot 0.7.0 watchdog Control Center

on:
  push:
    branches:
      - release/0.7.0-github-actions-watchdog
    paths:
      - scripts/hq_apply_070_watchdog_ui.py
      - .github/workflows/hq-apply-070-watchdog-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, fast]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.7.0-github-actions-watchdog
          fetch-depth: 0
      - name: Apply Control Center patch
        run: python3 scripts/hq_apply_070_watchdog_ui.py
      - name: Verify UI and all regressions
        run: |
          set -euo pipefail
          node --check chrome-extension/options/options.js
          npm test
          git diff --check
      - name: Commit UI and clean helper
        run: |
          set -euo pipefail
          rm -f scripts/hq_apply_070_watchdog_ui.py .github/workflows/hq-apply-070-watchdog-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: configure GitHub Actions watchdog per chat"
          git push origin HEAD:release/0.7.0-github-actions-watchdog
