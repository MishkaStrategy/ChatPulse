name: HQ one-shot clean obsolete 0.6.0 helper

on:
  push:
    branches:
      - release/0.6.0-control-center
    paths:
      - .github/workflows/hq-clean-060-last-helper.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: [self-hosted, fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.6.0-control-center
          fetch-depth: 0

      - name: Remove obsolete one-shot workflows and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hq-finalize-060-safety-mac.yml
          rm -f .github/workflows/hq-clean-060-last-helper.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove obsolete 0.6.0 validation helpers"
          git push origin HEAD:release/0.6.0-control-center
