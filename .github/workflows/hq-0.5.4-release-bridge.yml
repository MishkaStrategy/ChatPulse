name: HQ one-shot ChatPulse 0.5.4 release bridge

on:
  workflow_run:
    workflows: ["Dependency runner policy"]
    types: [completed]

permissions:
  contents: write
  issues: read

concurrency:
  group: hq-chatpulse-0.5.4-release-bridge
  cancel-in-progress: false

jobs:
  apply-release:
    if: >-
      github.event.workflow_run.id == 30872588990 &&
      github.event.workflow_run.head_branch == 'feature/stop-phrase-0.5.4' &&
      github.event.workflow_run.repository.full_name == github.repository
    name: HQ pinned 0.5.4 integration
    runs-on: [self-hosted, fast]
    timeout-minutes: 15
    env:
      RELEASE_BRANCH: feature/stop-phrase-0.5.4
      EXPECTED_HEAD: 2e6d79971ccd58619acac28551ddcf6d457c71a1
      EXPECTED_PAYLOAD_SHA: f1a702c1bfab1c167b486bd6d7c8a722eb1800ae58c58d1b45c9a8730a7748f5
      EXPECTED_ARTIFACT_SHA: 64b1285a767dcebc35b34d515c1b3cb6161000f39a19f4daa0c1cc827b4c4ed3

    steps:
      - name: Checkout pinned release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Assert exact release head
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD"
          echo "Pinned release head: $actual_head"

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore and verify pinned Issue 14 payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');

          const token = process.env.GH_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;
          const archivePath = '/tmp/chatpulse-0.5.4.tar.gz';
          const expectedSha = process.env.EXPECTED_PAYLOAD_SHA;
          const allowedRoots = new Set([
            '.github', 'CHANGELOG.md', 'README.md', 'chrome-extension',
            'package.json', 'scripts', 'tests',
          ]);

          if (!token || !repository || !expectedSha) {
            throw new Error('Missing required workflow environment');
          }

          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'chatpulse-hq-release-bridge',
          };

          async function githubApi(apiPath) {
            const response = await fetch(`https://api.github.com/repos/${repository}${apiPath}`, { headers });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status} for ${apiPath}`);
            }
            return response.json();
          }

          async function main() {
            const issue = await githubApi('/issues/14');
            const comments = [];
            for (let pageNumber = 1; ; pageNumber += 1) {
              const page = await githubApi(`/issues/14/comments?per_page=100&page=${pageNumber}`);
              comments.push(...page);
              if (page.length < 100) break;
            }
            comments.sort((left, right) => left.id - right.id);

            const encoded = [issue.body || '', ...comments.map((comment) => comment.body || '')]
              .join('\n')
              .replace(/\s+/g, '');
            if (!encoded || !/^[A-Za-z0-9+/]*={0,2}$/.test(encoded) || encoded.length % 4 !== 0) {
              throw new Error('Issue #14 does not contain valid base64 payload data');
            }

            const archive = Buffer.from(encoded, 'base64');
            const actualSha = crypto.createHash('sha256').update(archive).digest('hex');
            if (actualSha !== expectedSha) {
              throw new Error(`Unexpected payload SHA-256: ${actualSha}`);
            }
            fs.writeFileSync(archivePath, archive);

            const names = execFileSync('tar', ['-tzf', archivePath], { encoding: 'utf8' })
              .split('\n')
              .filter(Boolean);
            const verbose = execFileSync('tar', ['-tvzf', archivePath], { encoding: 'utf8' })
              .split('\n')
              .filter(Boolean);
            if (names.length !== 26 || verbose.length !== names.length) {
              throw new Error(`Unexpected payload member count: ${names.length}`);
            }

            names.forEach((name, index) => {
              const rawParts = name.split('/').filter((part) => part !== '' && part !== '.');
              const normalized = path.posix.normalize(name);
              if (
                path.posix.isAbsolute(name) ||
                rawParts.length === 0 ||
                rawParts.includes('..') ||
                normalized === '..' ||
                normalized.startsWith('../') ||
                !allowedRoots.has(rawParts[0])
              ) {
                throw new Error(`Unsafe or unexpected payload path: ${name}`);
              }
              if (!verbose[index].startsWith('-')) {
                throw new Error(`Only regular files are allowed: ${name}`);
              }
            });

            execFileSync('tar', ['-xzf', archivePath, '-C', '.'], { stdio: 'inherit' });
            console.log(`Verified payload SHA-256: ${actualSha}`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run complete 0.5.4 CI gate
        run: npm run audit:ci

      - name: Verify deterministic beta ZIP
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const zipPath = 'dist/ChatPulse-Chrome-v0.5.4-beta.zip';
          const checksumPath = `${zipPath}.sha256`;
          const expected = process.env.EXPECTED_ARTIFACT_SHA;
          const actual = crypto.createHash('sha256').update(fs.readFileSync(zipPath)).digest('hex');
          const checksumText = fs.readFileSync(checksumPath, 'utf8').trim();
          const match = checksumText.match(/^([0-9a-fA-F]{64})\s+\*?ChatPulse-Chrome-v0\.5\.4-beta\.zip$/);
          if (!match) throw new Error('Malformed beta ZIP checksum file');
          const declared = match[1].toLowerCase();
          if (declared !== expected || actual !== expected) {
            throw new Error(`Unexpected beta ZIP SHA-256: declared=${declared} actual=${actual}`);
          }
          console.log(`Verified beta ZIP SHA-256: ${actual}`);
          NODE

      - name: Verify permissions boundary and absence of secrets
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIE "API[_-]?KEY|CLIENT[_-]?SECRET|BEGIN (RSA|OPENSSH) PRIVATE KEY" chrome-extension tests scripts
          test ! -d chrome-extension/node_modules
          test ! -f chrome-extension/package-lock.json

      - name: Preserve release artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chatpulse-artifact
          mkdir -p /tmp/chatpulse-artifact
          cp dist/ChatPulse-Chrome-v0.5.4-beta.zip /tmp/chatpulse-artifact/
          cp dist/ChatPulse-Chrome-v0.5.4-beta.zip.sha256 /tmp/chatpulse-artifact/

      - name: Publish single 0.5.4 product commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          rm -rf dist .release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Добавить стоп-фразу ChatPulse 0.5.4"
          git push origin "HEAD:${RELEASE_BRANCH}"

      - name: Upload ChatPulse 0.5.4 beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatPulse-Chrome-v0.5.4-beta
          path: /tmp/chatpulse-artifact/*
          if-no-files-found: error
          retention-days: 30
