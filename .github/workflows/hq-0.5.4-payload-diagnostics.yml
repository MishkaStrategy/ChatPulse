name: HQ one-shot ChatPulse 0.5.4 payload diagnostics

on:
  workflow_run:
    workflows: ["Dependency runner policy"]
    types: [completed]

permissions:
  contents: read
  issues: read

concurrency:
  group: hq-chatpulse-0.5.4-payload-diagnostics
  cancel-in-progress: false

jobs:
  diagnose-payload:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository
    name: Pinned payload provenance diagnostics
    runs-on: [self-hosted, fast]
    timeout-minutes: 10
    env:
      EXPECTED_PAYLOAD_SHA: f1a702c1bfab1c167b486bd6d7c8a722eb1800ae58c58d1b45c9a8730a7748f5

    steps:
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Diagnose Issue 14 reconstruction without executing payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');

          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const expected = process.env.EXPECTED_PAYLOAD_SHA;
          const archivePath = '/tmp/chatpulse-0.5.4-observed.tar.gz';
          const allowedRoots = new Set([
            '.github', 'CHANGELOG.md', 'README.md', 'chrome-extension',
            'package.json', 'scripts', 'tests',
          ]);
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'chatpulse-hq-payload-diagnostics',
          };

          function sha256(buffer) {
            return crypto.createHash('sha256').update(buffer).digest('hex');
          }

          function normalizedBase64(chunks) {
            return chunks.map((chunk) => chunk.body || '').join('\n').replace(/\s+/g, '');
          }

          function decodedHash(chunks) {
            const encoded = normalizedBase64(chunks);
            if (!encoded || !/^[A-Za-z0-9+/]*={0,2}$/.test(encoded) || encoded.length % 4 !== 0) {
              return null;
            }
            return sha256(Buffer.from(encoded, 'base64'));
          }

          async function api(apiPath) {
            const response = await fetch(`https://api.github.com/repos/${repository}${apiPath}`, { headers });
            if (!response.ok) throw new Error(`GitHub API ${response.status}: ${apiPath}`);
            return response.json();
          }

          function* permutations(items, prefix = []) {
            if (items.length === 0) {
              yield prefix;
              return;
            }
            for (let i = 0; i < items.length; i += 1) {
              const rest = items.slice(0, i).concat(items.slice(i + 1));
              yield* permutations(rest, prefix.concat(items[i]));
            }
          }

          async function main() {
            const issue = await api('/issues/14');
            const comments = [];
            for (let page = 1; ; page += 1) {
              const batch = await api(`/issues/14/comments?per_page=100&page=${page}`);
              comments.push(...batch);
              if (batch.length < 100) break;
            }
            comments.sort((a, b) => a.id - b.id);

            const chunks = [
              {
                key: 'issue-body',
                id: issue.id,
                created_at: issue.created_at,
                updated_at: issue.updated_at,
                body: issue.body || '',
              },
              ...comments.map((comment) => ({
                key: `comment-${comment.id}`,
                id: comment.id,
                created_at: comment.created_at,
                updated_at: comment.updated_at,
                body: comment.body || '',
              })),
            ];

            console.log(JSON.stringify({
              issue: {
                number: issue.number,
                created_at: issue.created_at,
                updated_at: issue.updated_at,
                comments: comments.length,
              },
              chunks: chunks.map((chunk) => ({
                key: chunk.key,
                created_at: chunk.created_at,
                updated_at: chunk.updated_at,
                body_length: chunk.body.length,
                body_sha256: sha256(Buffer.from(chunk.body, 'utf8')),
              })),
            }, null, 2));

            const observedHash = decodedHash(chunks);
            console.log(`observed_archive_sha256=${observedHash}`);
            console.log(`expected_archive_sha256=${expected}`);

            const subsetMatches = [];
            const issueChunk = chunks[0];
            const commentChunks = chunks.slice(1);
            for (let mask = 0; mask < (1 << commentChunks.length); mask += 1) {
              const candidate = [issueChunk];
              for (let i = 0; i < commentChunks.length; i += 1) {
                if ((mask & (1 << i)) !== 0) candidate.push(commentChunks[i]);
              }
              if (decodedHash(candidate) === expected) {
                subsetMatches.push(candidate.map((chunk) => chunk.key));
              }
            }
            console.log(`ordered_subset_matches=${JSON.stringify(subsetMatches)}`);

            const permutationMatches = [];
            for (const permutation of permutations(commentChunks)) {
              if (decodedHash([issueChunk, ...permutation]) === expected) {
                permutationMatches.push(permutation.map((chunk) => chunk.key));
              }
            }
            console.log(`full_comment_permutation_matches=${JSON.stringify(permutationMatches)}`);

            const encoded = normalizedBase64(chunks);
            const archive = Buffer.from(encoded, 'base64');
            fs.writeFileSync(archivePath, archive);
            const magic = archive.subarray(0, 3).toString('hex');
            console.log(`observed_size_bytes=${archive.length}`);
            console.log(`gzip_magic=${magic}`);

            const names = execFileSync('tar', ['-tzf', archivePath], { encoding: 'utf8' })
              .split('\n').filter(Boolean);
            const verbose = execFileSync('tar', ['-tvzf', archivePath], { encoding: 'utf8' })
              .split('\n').filter(Boolean);
            const diagnostics = {
              member_count: names.length,
              regular_file_count: verbose.filter((line) => line.startsWith('-')).length,
              allowed_roots_only: true,
              unsafe_paths: [],
              roots: [...new Set(names.map((name) => name.split('/').filter(Boolean)[0]).filter(Boolean))].sort(),
            };
            names.forEach((name) => {
              const rawParts = name.split('/').filter((part) => part !== '' && part !== '.');
              const normalized = path.posix.normalize(name);
              const unsafe = path.posix.isAbsolute(name)
                || rawParts.length === 0
                || rawParts.includes('..')
                || normalized === '..'
                || normalized.startsWith('../');
              if (unsafe) diagnostics.unsafe_paths.push(name);
              if (!rawParts.length || !allowedRoots.has(rawParts[0])) diagnostics.allowed_roots_only = false;
            });
            console.log(`archive_structure=${JSON.stringify(diagnostics)}`);

            if (observedHash === expected) {
              console.log('RESULT=EXPECTED_HASH_MATCH');
            } else if (subsetMatches.length || permutationMatches.length) {
              console.log('RESULT=RECONSTRUCTION_MATCH_FOUND');
            } else {
              console.log('RESULT=NO_SIMPLE_RECONSTRUCTION_MATCH');
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
