name: HQ one-shot ChatPulse 0.5.4 payload diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hq-0.5.4-payload-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: hq-chatpulse-0.5.4-payload-history-v3
  cancel-in-progress: false

jobs:
  diagnose-payload-history:
    name: Search Git history for payload snapshot
    runs-on: [self-hosted, fast]
    timeout-minutes: 10

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch retained pull-request heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/pull/*/head:refs/remotes/pull/*' || true

      - name: Compare archived file hashes with reachable commits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess

          expected = {
              '.github/workflows/extension-ci.yml': 'd9d9f26da2afd2fd14cebaee88718a5d139a94b61f642a6c756862ed44c218ea',
              'CHANGELOG.md': '9fa03a5019a004e42840164786f6032b2f97fee1f0b9ad9f6cb58ae67640443a',
              'README.md': '9ef72a5d4cf84bf46d175e93d203d4c0eb6aa6d2ddf03475bda4522553850cf6',
              'chrome-extension/README.md': 'cbdc15ea35bc43dc45f9f13b320d336a30c767a6a70de8f256d69b07619a722b',
              'chrome-extension/assets/icon-128.png': 'd41c501d7d292572f8c7a17802e09bd65e8760a41171d389e39eb02c60e064f1',
              'chrome-extension/assets/icon-16.png': 'f8e1f2a3fbb111b35d487b2ee65c764e62513b4dee784bf61e6af4c993125e26',
              'chrome-extension/assets/icon-32.png': '232c3f1a3ed0c77f7c0632f0069313f260dfe670ed844343a63c68c49b3e5742',
              'chrome-extension/assets/icon-48.png': '195fa7eb16dd9d540f9856c6cc1fdcd3b94ebcc4ceae9e98bf20046a9ca2b928',
              'chrome-extension/assets/logo.svg': '3604e6a2cb5fcc5fcad70ba5448767de22692a9bd759fae0d2d68a21f2911e8c',
              'chrome-extension/background/service-worker-v2.js': '2fc80e99f31d30b14302e8672744c70095d329ab5abdfc89df5d760c0a2a826a',
              'chrome-extension/content/content-script.js': 'fd2ade10d3923ee1413202f8fbb749331f600837abe8f449ba5e148cc0323700',
              'chrome-extension/lib/model-v2.js': 'e4e0fbf10e4a31579b6a3c4ed9c98cd1ed5703e7f2db0c9a12ef88141675903a',
          }
          product_keys = [
              'chrome-extension/background/service-worker-v2.js',
              'chrome-extension/content/content-script.js',
              'chrome-extension/lib/model-v2.js',
          ]

          def git(*args, check=True):
              result = subprocess.run(
                  ['git', *args],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  check=check,
              )
              return result.stdout

          def file_bytes(commit, path):
              result = subprocess.run(
                  ['git', 'show', f'{commit}:{path}'],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
              )
              return result.stdout if result.returncode == 0 else None

          def digest(data):
              return hashlib.sha256(data).hexdigest() if data is not None else None

          commits = git('rev-list', '--all').decode().splitlines()
          rows = []
          for commit in commits:
              matched = []
              missing = []
              mismatched = []
              for path, wanted in expected.items():
                  data = file_bytes(commit, path)
                  if data is None:
                      missing.append(path)
                  elif digest(data) == wanted:
                      matched.append(path)
                  else:
                      mismatched.append(path)
              product_matches = sum(path in matched for path in product_keys)
              if matched or product_matches:
                  message = git('show', '-s', '--format=%s', commit).decode(errors='replace').strip()
                  timestamp = git('show', '-s', '--format=%cI', commit).decode(errors='replace').strip()
                  rows.append({
                      'commit': commit,
                      'matched_count': len(matched),
                      'product_matches': product_matches,
                      'missing_count': len(missing),
                      'mismatched_count': len(mismatched),
                      'message': message,
                      'timestamp': timestamp,
                      'matched': matched,
                  })

          rows.sort(key=lambda row: (row['matched_count'], row['product_matches'], row['timestamp']), reverse=True)
          top = rows[:20]
          exact = [row for row in rows if row['matched_count'] == len(expected)]
          product_exact = [row for row in rows if row['product_matches'] == len(product_keys)]

          print(f'reachable_commit_count={len(commits)}')
          print('exact_12_file_matches=' + json.dumps(exact))
          print('exact_3_product_file_matches=' + json.dumps(product_exact[:20]))
          print('top_reachable_matches=' + json.dumps(top))

          if exact:
              print('RESULT=EXACT_SNAPSHOT_COMMIT_FOUND')
          elif product_exact:
              print('RESULT=PRODUCT_CORE_COMMIT_FOUND')
          else:
              print('RESULT=NO_REACHABLE_PRODUCT_SNAPSHOT')
          PY
