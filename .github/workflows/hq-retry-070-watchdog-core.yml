name: HQ retry 0.7.0 watchdog core

on:
  push:
    branches:
      - release/0.7.0-github-actions-watchdog
    paths:
      - .github/workflows/hq-retry-070-watchdog-core.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.7.0-github-actions-watchdog
          fetch-depth: 0
      - name: Repair helper and apply core patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/hq_apply_070_watchdog_core.py')
          text = path.read_text(encoding='utf-8')
          old = "model = replace_once(model, '    schemaVersion: 4,\\n', '    schemaVersion: 5,\\n', 'default schema v5')\nmodel = replace_once(model, '    schemaVersion: 4,\\n', '    schemaVersion: 5,\\n', 'normalized schema v5')"
          new = "schema_anchor = '    schemaVersion: 4,\\n'\nif model.count(schema_anchor) != 2:\n    raise SystemExit(f'schema v5: expected two anchors, found {model.count(schema_anchor)}')\nmodel = model.replace(schema_anchor, '    schemaVersion: 5,\\n', 2)"
          if text.count(old) != 1:
              raise SystemExit('schema helper repair anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/hq_apply_070_watchdog_core.py
      - name: Verify focused core
        run: |
          set -euo pipefail
          node --check chrome-extension/lib/model-v2.js
          node --test tests/chrome-extension/github-watchdog.test.mjs
          git diff --check
      - name: Commit product core and clean helpers
        run: |
          set -euo pipefail
          rm -f scripts/hq_apply_070_watchdog_core.py .github/workflows/hq-apply-070-watchdog-core.yml .github/workflows/hq-retry-070-watchdog-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add GitHub Actions watchdog state model"
          git push origin HEAD:release/0.7.0-github-actions-watchdog
